<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mock page</title>
<style>
  :root { color-scheme: light dark; font: 14px system-ui, sans-serif; }
  body { margin: 0; padding: 16px; background: Canvas; color: CanvasText; }
  #state { font-weight: 600; }
  #tab { opacity: .7; margin-bottom: 4px; min-height: 1.4em; }
  #url { opacity: .7; margin-bottom: 16px; overflow-wrap: anywhere; min-height: 1.4em; }
  form { display: flex; gap: 8px; margin-bottom: 8px; max-width: 520px; }
  input { flex: 1; min-width: 0; padding: 6px 8px; font: inherit; }
  button { padding: 6px 12px; font: inherit; min-width: 96px; }
</style>
</head>
<body>
  <div id="state">Empty</div>
  <div id="tab"></div>
  <div id="url"></div>
  <form data-kind="navigate"><input value="https://example.com/next"><button>Navigate</button></form>
  <form data-kind="title"><input value="A new title"><button>Title</button></form>
  <form data-kind="fail"><input value="ERR_CONNECTION_REFUSED"><button>Fail</button></form>
  <form data-kind="crash"><button>Crash</button></form>
  <form data-kind="favicon"><input value="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='7' fill='%230faaaa'/%3E%3C/svg%3E" aria-label="Favicon data URL"><button>Favicon</button></form>
  <form data-kind="open"><input value="https://opened.test/"><button>Open in new tab</button></form>
  <form data-kind="key"><input value="focusAddressBar" aria-label="Key name"><button>Key</button></form>
  <form data-kind="fullscreen"><button>Full screen</button></form>
<script>
  const label = {empty: 'Empty', loading: 'Loading', loaded: 'Loaded', blocked: 'Blocked', crashed: 'Crashed', none: 'No tab', closed: 'Window closed'};
  for (const form of document.querySelectorAll('form')) {
    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const input = form.querySelector('input');
      fetch('/mock/fire', {
        method: 'POST',
        body: new URLSearchParams({kind: form.dataset.kind, value: input ? input.value : ''}),
      });
    });
  }
  new EventSource('/mock/events').onmessage = (e) => {
    const m = JSON.parse(e.data);
    document.getElementById('state').textContent = label[m.state] || m.state;
    document.getElementById('tab').textContent = m.tab ? 'tab ' + m.tab : '';
    document.getElementById('url').textContent = m.url;
  };
</script>
</body>
</html>
